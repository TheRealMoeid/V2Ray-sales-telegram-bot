version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: v2ray_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: v2ray_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: v2ray_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/v2ray_bot
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      BANK_CARD_NUMBER: ${BANK_CARD_NUMBER:-6037-XXXX-XXXX-XXXX}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-Account Holder}
      BANK_NAME: ${BANK_NAME:-Bank Name}
      SHOP_NAME: ${SHOP_NAME:-V2Ray Shop}
      SUPPORT_USERNAME: ${SUPPORT_USERNAME:-@support}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
